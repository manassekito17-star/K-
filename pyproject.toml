[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kplus"
version = "0.2.0"
description = "K+ : langage de programmation généraliste en français"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Interpreters",
]

[project.scripts]
kplus = "kplus.cli:principal"

[tool.setuptools]
packages = ["kplus"]

[tool.setuptools.package-data]
kplus = ["rendu_web.js", "site/*"]
