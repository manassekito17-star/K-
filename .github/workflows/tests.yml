name: Tests K+

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests unitaires, conformité, exemples et robustesse
        run: python -m unittest -v
      - name: Installation de la commande kplus
        run: |
          python -m pip install .
          kplus --version
          kplus exemples/bonjour.kplus

  studio:
    name: K+ Studio (navigateur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests de la coloration syntaxique
        run: node --test studio/tests/coloration.test.mjs
      - name: Installation de Chromium (Playwright)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Test de bout en bout dans le navigateur
        run: node studio/tests/e2e.mjs
      - name: Test dans un sous-dossier (comme sur GitHub Pages)
        run: node studio/tests/e2e.mjs --sous-chemin K-
